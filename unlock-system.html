<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔓 Sistema Desbloqueado - Grupo BNC RH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f3f4f6; }
        .hidden { display: none !important; }
        .sidebar-item.active { background: rgba(255,255,255,0.1); border-left-color: white; }
    </style>
</head>
<body class="h-screen flex bg-gray-50">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-white">
        <div class="w-full max-w-md p-8">
            <h1 class="text-3xl font-bold text-orange-600 mb-2 text-center"><i class="fas fa-cube mr-2"></i>Grupo BNC</h1>
            <p class="text-gray-500 text-center mb-8">Sistema Desbloqueado</p>
            
            <form onsubmit="doLogin(event)" class="space-y-4">
                <input type="email" id="email" placeholder="E-mail (admin@grupobnc.com.br)" class="w-full px-4 py-3 border rounded-lg" value="admin@grupobnc.com.br">
                <input type="password" id="password" placeholder="Senha (BNC@2026#Admin)" class="w-full px-4 py-3 border rounded-lg" value="BNC@2026#Admin">
                <button type="submit" class="w-full bg-orange-600 text-white font-bold py-3 rounded-lg hover:bg-orange-700">ENTRAR AGORA</button>
            </form>
            
            <div id="msg" class="mt-4 text-center text-sm font-bold"></div>
        </div>
    </div>

    <!-- DASHBOARD (Oculto inicialmente) -->
    <div id="dashboard" class="hidden w-full h-full flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-orange-900 text-white p-6">
            <h2 class="text-xl font-bold mb-8"><i class="fas fa-cube mr-2"></i>BNC RH</h2>
            <nav class="space-y-4">
                <a href="#" class="block py-2 px-4 rounded hover:bg-orange-800 active">🏠 Início</a>
                <a href="#" class="block py-2 px-4 rounded hover:bg-orange-800"> Contratos</a>
                <a href="#" class="block py-2 px-4 rounded hover:bg-orange-800">👥 Funcionários</a>
                <a href="#" class="block py-2 px-4 rounded hover:bg-orange-800"> Escalas</a>
                <a href="#" onclick="location.reload()" class="block py-2 px-4 rounded bg-red-600 mt-8">🚪 Sair</a>
            </nav>
        </aside>

        <!-- Content -->
        <main class="flex-1 p-8 overflow-y-auto">
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-bold text-gray-800">Painel Geral</h1>
                <div class="flex items-center gap-4">
                    <span class="text-gray-600" id="user-name">Administrador</span>
                    <img src="https://ui-avatars.com/api/?name=Admin&background=ea580c&color=fff" class="w-10 h-10 rounded-full">
                </div>
            </header>

            <!-- KPIs -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow border-l-4 border-orange-500">
                    <p class="text-gray-500 text-xs uppercase">Contratos</p>
                    <h3 class="text-3xl font-bold" id="kpi-contracts">...</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow border-l-4 border-blue-500">
                    <p class="text-gray-500 text-xs uppercase">Funcionários</p>
                    <h3 class="text-3xl font-bold" id="kpi-employees">...</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow border-l-4 border-green-500">
                    <p class="text-gray-500 text-xs uppercase">Tarefas Hoje</p>
                    <h3 class="text-3xl font-bold" id="kpi-tasks">...</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow border-l-4 border-purple-500">
                    <p class="text-gray-500 text-xs uppercase">Pendências</p>
                    <h3 class="text-3xl font-bold">R$ 24.800</h3>
                </div>
            </div>

            <!-- Lista de Contratos -->
            <div class="bg-white rounded-xl shadow p-6">
                <h3 class="font-bold text-gray-800 mb-4">Contratos Ativos</h3>
                <div id="contracts-list" class="space-y-3">
                    <p class="text-gray-400">Carregando...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuração Direta (Sem arquivos externos)
        const SUPABASE_URL = 'https://rvgcniaowzmsudzliozf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2Z2NuaWFvd3ptc3Vkemxpb3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MjQxNzQsImV4cCI6MjA5MTQwMDE3NH0.uwwKFLuK-XyPoXPrB6_CseRTiD9d-iyMQSPWrFw-l-I';
        
        // Inicializa o cliente
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function doLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');
            
            msg.innerText = 'Conectando...';
            msg.className = 'mt-4 text-center text-sm font-bold text-blue-600';

            try {
                // 1. Login no Auth
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;

                msg.innerText = 'Buscando perfil...';
                
                // 2. Buscar Perfil
                const { data: profile } = await supabase
                    .from('bnc_profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .single();

                // 3. Sucesso! Mostrar Dashboard
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                
                document.getElementById('user-name').innerText = profile?.full_name || 'Usuário';
                
                // 4. Carregar Dados Reais
                loadRealData();

            } catch (err) {
                msg.innerText = 'ERRO: ' + err.message;
                msg.className = 'mt-4 text-center text-sm font-bold text-red-600';
                console.error(err);
            }
        }

        async function loadRealData() {
            // Buscar Contratos
            const { data: contracts } = await supabase.from('bnc_contracts').select('*').eq('status', 'active');
            document.getElementById('kpi-contracts').innerText = contracts?.length || 0;
            
            // Calcular Funcionários
            const totalEmp = contracts?.reduce((sum, c) => sum + (c.employee_count || 0), 0) || 0;
            document.getElementById('kpi-employees').innerText = totalEmp;

            // Buscar Tarefas
            const today = new Date().toISOString().split('T')[0];
            const { data: tasks } = await supabase.from('bnc_tasks').select('status').eq('scheduled_date', today);
            const done = tasks?.filter(t => t.status === 'completed').length || 0;
            document.getElementById('kpi-tasks').innerText = `${done} / ${tasks?.length || 0}`;

            // Listar Contratos
            const list = document.getElementById('contracts-list');
            if (contracts && contracts.length > 0) {
                list.innerHTML = contracts.map(c => `
                    <div class="flex justify-between items-center p-3 bg-gray-50 rounded border">
                        <div>
                            <p class="font-bold">${c.client_name}</p>
                            <p class="text-xs text-gray-500">${c.employee_count} funcionários</p>
                        </div>
                        <span class="text-green-600 text-sm font-bold">Ativo</span>
                    </div>
                `).join('');
            } else {
                list.innerHTML = '<p class="text-gray-500">Nenhum contrato encontrado.</p>';
            }
        }
    </script>
</body>
</html>
